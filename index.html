<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Mall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="brand">
            <img src="future-mall-logo.png" alt="Future Mall Logo">
        </div>

        <div class="nav-right">
            <a href="#">Sign In</a>
            <a href="#">Sign Out</a>
        </div>
    </nav>

    <main>

        <section class="hero">

            <div class="hero-text">
                <span class="small-title">WELCOME TO</span>

                <h1>Future <strong>Mall</strong></h1>

                <p>
                    A <strong>modern and smart</strong> shopping destination
                    designed to provide visitors with a
                    <em>comfortable and enjoyable</em> experience.
                </p>
            </div>

        </section>

        <section class="stores">

            <div class="section-heading">
                <span>EXPLORE</span>
                <h2>Our <strong>Stores</strong></h2>
            </div>

            <div class="store-grid">

                <div class="store-card">
                    <h3>ACTIVE</h3>
                </div>

                <div class="store-card">
                    <h3>DECATHLON</h3>
                </div>

                <div class="store-card">
                    <h3>Kabbani Furniture</h3>
                </div>

                <div class="store-card">
                    <h3>Future Café</h3>
                </div>

                <div class="store-card">
                    <h3>Beauty Center</h3>
                </div>

            </div>

        </section>

    </main>

    <section class="connect">

        <div>
            <span>GET IN TOUCH</span>
            <h2>Connect <strong>Us</strong></h2>
        </div>

        <button>Contact Us</button>

    </section>

</body>
</html>
